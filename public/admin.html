<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Teacher Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<section id="login" class="login-screen" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="logo">AI</span><div><b>AI Teacher</b><small>Admin panel</small></div></div>
    <label><span data-t="username">Login</span><input name="username" autocomplete="username" required></label>
    <label><span data-t="password">Parol</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="form-error" id="loginError" role="alert"></p>
    <button class="btn primary big" type="submit" data-t="login">Kirish</button>
    <details class="demo-accounts">
      <summary>Demo hisoblar</summary>
      <table>
        <tr><td>superadmin</td><td>Admin#2026</td><td>Super Admin</td></tr>
        <tr><td>maktab.admin</td><td>Admin#2026</td><td>Muassasa admini</td></tr>
        <tr><td>director</td><td>Director#2026</td><td>Direktor</td></tr>
        <tr><td>teacher</td><td>Teacher#2026</td><td>O‘qituvchi</td></tr>
        <tr><td>tech</td><td>Tech#2026</td><td>Texnik xodim</td></tr>
      </table>
    </details>
  </form>
</section>

<div id="app" class="admin-app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="logo">AI</span><div><b>AI Teacher</b><small>Admin</small></div></div>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main">
    <header class="main-head"><button class="icon-btn menu" id="menuBtn" aria-label="Menyu">☰</button><h1 id="pageTitle"></h1><div id="pageActions" class="row"></div></header>
    <div id="page"></div>
  </main>
</div>

<dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="mode-banner" id="modeBanner" hidden></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
